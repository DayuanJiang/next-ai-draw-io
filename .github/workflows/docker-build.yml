name: Docker Build and Push

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  # Run it by hand on main when a push did not trigger it (GitHub drops an
  # event now and then); it then pushes to ECR like a push to main
  workflow_dispatch:

# One run per branch at a time. On main, deploys that overlapped replaced
# each other and the earlier ones failed ("rolled back"); now a new run waits
# for the one in progress, and of several waiting only the newest runs. A new
# push to a pull request cancels its older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Each platform builds on a runner of its own CPU type. Built under QEMU
  # emulation on an x86 runner, arm64 took about 20 minutes and now and then
  # crashed (SIGILL) or hung.
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Image name in lowercase
        run: echo "IMAGE=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      # Pushed by digest only: the publish job below tags both platforms
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          provenance: mode=max
          sbom: true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          platforms: linux/${{ matrix.arch }}
          build-args: |
            NEXT_PUBLIC_SHOW_ABOUT_AND_NOTICE=true

      - name: Export the digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # The tags for both platforms, then the demo's deploy
  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Short-lived AWS credentials (OIDC) for the deploy steps below
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Image name in lowercase
        run: echo "IMAGE=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Download the digests
        uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Tag both platforms
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

      # Push to AWS ECR and deploy the demo (an ECS service that Cloudflare
      # reaches through a tunnel). The role trusts only this repository's
      # main branch.
      - name: Configure AWS credentials
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActions-next-ai-draw-io-deploy
          aws-region: ap-northeast-1

      - name: Login to Amazon ECR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # :latest also still deploys the App Runner service until it is removed
      - name: Push to ECR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          REPO_LOWER: ${{ github.repository }}
          ECR_IMAGE: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-1.amazonaws.com/next-ai-draw-io
        run: |
          REPO_LOWER=$(echo "$REPO_LOWER" | tr '[:upper:]' '[:lower:]')
          docker pull ghcr.io/${REPO_LOWER}:latest
          docker tag ghcr.io/${REPO_LOWER}:latest $ECR_IMAGE:latest
          docker tag ghcr.io/${REPO_LOWER}:latest $ECR_IMAGE:sha-$GITHUB_SHA
          docker push $ECR_IMAGE:latest
          docker push $ECR_IMAGE:sha-$GITHUB_SHA

      # The service's current task definition with the new app image: env
      # vars, size and the tunnel container stay as set in AWS
      - name: Render the task definition
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: taskdef
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: next-ai-draw-io
          container-name: app
          image: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-1.amazonaws.com/next-ai-draw-io:sha-${{ github.sha }}

      # The live pages before the deploy, to tell IndexNow afterwards which
      # ones changed. Never blocks the deploy.
      - name: Snapshot the site's pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: node scripts/indexnow.mjs snapshot "$RUNNER_TEMP/pages-before.json"

      # Waits until the new task serves, so a failed deploy fails this run
      # (ECS also rolls it back)
      - name: Deploy to ECS
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.taskdef.outputs.task-definition }}
          cluster: default
          service: next-ai-draw-io
          wait-for-service-stability: true

      # Bing and the other IndexNow engines recrawl the pages whose text or
      # head tags changed
      - name: Tell IndexNow which pages changed
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          if [ -f "$RUNNER_TEMP/pages-before.json" ]; then
            node scripts/indexnow.mjs submit "$RUNNER_TEMP/pages-before.json"
          else
            echo "No snapshot from before the deploy"
          fi

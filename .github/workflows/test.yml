name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-unit:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run check

      - name: Run unit tests
        run: npm run test -- --run

      # The MCP server package ships its own vitest because its DOM polyfill
      # (linkedom) needs `environment: node`, while the root vitest uses jsdom
      # for the Next.js app. Install + run its tests separately so CI catches
      # multi-page mxfile regressions.
      - name: Install MCP server dependencies
        run: npm --prefix packages/mcp-server ci

      - name: Run MCP server unit tests
        run: npm --prefix packages/mcp-server test

      # Tests run from src/, so check the built npm package separately
      - name: Build MCP server and check package contents
        run: npm --prefix packages/mcp-server run build && npm --prefix packages/mcp-server run check-package

  e2e:
    # Six jobs at once, each with a sixth of the tests and one worker: the
    # same conditions per test, a fraction of the time
    name: E2E Tests (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright deps (cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Build app
        run: npm run build

      - name: Run E2E tests
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/6
        env:
          CI: true

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

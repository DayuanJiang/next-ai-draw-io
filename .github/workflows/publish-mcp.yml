name: Publish MCP Server

# Publishes @next-ai-drawio/mcp-server to npm via OIDC trusted publishing
# (no token, no OTP), then its server.json to the official MCP registry,
# also via OIDC. Triggers when packages/mcp-server or the web app code
# bundled into the canvas shell (scripts/build-shell.mjs) changes on main;
# skips silently if the version is already on npm and in the registry, so a
# release is just "bump the version in a PR and merge".
on:
  push:
    branches:
      - main
    paths:
      - "packages/mcp-server/**"
      # The canvas shell is bundled from these with the root's lockfile
      - "components/**"
      - "contexts/**"
      - "hooks/**"
      - "lib/**"
      - "stores/**"
      - "app/globals.css"
      - "package-lock.json"
      # The package's build scripts import the root's scripts/drawio-zip.mjs
      - "scripts/**"
      - ".github/workflows/publish-mcp.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing and the MCP registry

concurrency:
  group: publish-mcp
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mcp-server
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            packages/mcp-server/package-lock.json
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing requires npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@latest

      - name: Check if version is already published
        id: version
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          if npm view "@next-ai-drawio/mcp-server@${LOCAL}" version >/dev/null 2>&1; then
            echo "Version ${LOCAL} already on npm - nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version ${LOCAL} not on npm - publishing"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # The canvas shell (scripts/build-shell.mjs) is bundled from the web
      # app's components with the root's esbuild, Tailwind and React
      - name: Install repository dependencies
        if: steps.version.outputs.publish == 'true'
        working-directory: .
        run: npm ci

      - name: Install dependencies
        if: steps.version.outputs.publish == 'true'
        run: npm ci

      - name: Test
        if: steps.version.outputs.publish == 'true'
        run: npm test

      # The build downloads the pinned draw.war from GitHub releases
      # (scripts/fetch-drawio.mjs) and bundles a trimmed draw.io into
      # dist/drawio; check-package confirms it is in the tarball
      - name: Build and check package contents
        if: steps.version.outputs.publish == 'true'
        run: npm run build && npm run check-package

      - name: Publish to npm
        if: steps.version.outputs.publish == 'true'
        run: npm publish

      # The official MCP registry (registry.modelcontextprotocol.io) lists
      # server.json. GitHub's OIDC token proves the io.github.DayuanJiang
      # namespace, so there is no login and no secret. It runs after npm (the
      # registry checks the npm package), and also when only the registry
      # lacks the version, so a manual run fills it in
      - name: Check if version is in the MCP registry
        id: registry
        run: |
          NAME=$(node -p "require('./server.json').name")
          VERSION=$(node -p "require('./server.json').version")
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.modelcontextprotocol.io/v0/servers/${NAME/\//%2F}/versions/${VERSION}")
          if [ "$CODE" = "200" ]; then
            echo "${NAME} ${VERSION} already in the MCP registry"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "${NAME} ${VERSION} not in the MCP registry (HTTP ${CODE}) - publishing"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to the MCP registry
        if: steps.registry.outputs.publish == 'true'
        run: |
          curl -sSfL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.7/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

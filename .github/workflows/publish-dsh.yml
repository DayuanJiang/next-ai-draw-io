name: Publish DSH plugin

# Publishes @next-ai-drawio/dsh (the DeepSeek Harness plugin) to npm via OIDC
# trusted publishing. Skips silently if the package.json version is already
# on npm, so a release is "bump the version in a PR and merge".
on:
  push:
    branches:
      - main
    paths:
      - "packages/dsh-plugin/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing

concurrency:
  group: publish-dsh
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dsh-plugin
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing requires npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@latest

      - name: Check if version is already published
        id: version
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          if npm view "@next-ai-drawio/dsh@${LOCAL}" version >/dev/null 2>&1; then
            echo "Version ${LOCAL} already on npm - nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version ${LOCAL} not on npm - publishing"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.version.outputs.publish == 'true'
        run: npm publish
